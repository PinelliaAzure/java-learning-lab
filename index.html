<!DOCTYPE html>

<meta name="color-scheme" content="dark light">
<title>Java 学习地图 · 教材精讲 + 闯关练习</title>
<meta name="description" content="面向零基础的 Java 全栈学习站：20 个模块 / 84 个知识点 / 252 道题，教材精讲 + 流程图 + 闯关练习。双击即可离线使用。">
<script>
/* 在首屏渲染前应用主题，避免闪烁 */
(function () {
  try {
    var mode = localStorage.getItem('java-lab-theme') || 'auto';
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', mode === 'auto' ? (dark ? 'dark' : 'light') : mode);
    document.documentElement.setAttribute('data-theme-mode', mode);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>

<div class="backdrop" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/" id="brand">

      <svg viewBox="0 0 24 24"><path d="M4 8h13v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8Z"/><path d="M17 9h2a2 2 0 0 1 0 4h-2"/><path d="M7 4c0 .8.8 1 .8 1.8M10 3c0 .8.8 1 .8 1.8"/></svg>
    </span>
    <span class="brand-text">
      <b>Java 学习地图</b>
      <small><span id="brand-total">84</span> 个知识点 · 教材精讲 · 闯关验证</small>
    </span>
  </a>

  <div class="head-right">
    <div class="theme-switch" id="theme-switch" role="group" aria-label="主题模式">
      <button type="button" data-mode="light" title="日间模式" aria-label="日间模式">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-mode="dark" title="夜间模式" aria-label="夜间模式">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </button>
      <button type="button" data-mode="auto" title="跟随系统" aria-label="跟随系统主题">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
    <div class="progress-ring" title="已学完的知识点">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16" class="ring-bg"></circle>
        <circle cx="20" cy="20" r="16" class="ring-fg" id="ring-fill"></circle>
      </svg>
      <span id="ring-text">0%</span>
    </div>
    <div class="head-stats">
      <div><b id="stat-done">0</b><span>/ 84 已学</span></div>
      <div><b id="stat-pass">0</b><span> 课已通过</span></div>
    </div>
  </div>
</header>
