<script>
/* 在首屏渲染前应用主题，避免闪烁（与课程页共用同一个键） */
(function () {
  try {
    var mode = localStorage.getItem('java-lab-theme') || 'auto';
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', mode === 'auto' ? (dark ? 'dark' : 'light') : mode);
    document.documentElement.setAttribute('data-theme-mode', mode);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<script>
/* 主题切换：与课程页共用 localStorage 键与 data-theme 机制 */
(function () {
  var KEY = 'java-lab-theme';
  var mq = null;
  var mode = 'auto';
  try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) {}
  try { mode = localStorage.getItem(KEY) || 'auto'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'auto';

  var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-mode]'));

  function apply() {
    var resolved = mode === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-mode', mode);
    buttons.forEach(function (btn) {
      var on = btn.getAttribute('data-mode') === mode;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = btn.getAttribute('data-mode');
      if (next !== 'light' && next !== 'dark' && next !== 'auto') return;
      mode = next;
      try { localStorage.setItem(KEY, mode); } catch (e) {}
      apply();
    });
  });

  if (mq) {
    if (mq.addEventListener) mq.addEventListener('change', function () { if (mode === 'auto') apply(); });
    else if (mq.addListener) mq.addListener(function () { if (mode === 'auto') apply(); });
  }

  apply();
})();
</script>
